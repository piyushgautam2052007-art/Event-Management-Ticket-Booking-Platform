<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Events</title>

    <link rel="stylesheet" href="events.css">
</head>

<body>

    <header>
        <h1>Event Management & Ticket Booking</h1>
        <p>Explore Upcoming Events</p>
    </header>

    <main>

        <section>
            <h2>Available Events</h2>

            <div id="eventList">
                <!-- Events will appear here -->
            </div>
        </section>

        <section>
            <h2>Event Details</h2>

            <div id="eventDetails">
                <p>Select an event to see its details.</p>
            </div>
        </section>

        <section>
            <h2>Book Tickets</h2>

            <label for="eventSelect">Select Event:</label>

            <select id="eventSelect">
                <option value="">-- Select Event --</option>
            </select>

            <br><br>

            <label for="ticketQuantity">Number of Tickets:</label>

            <input
                type="number"
                id="ticketQuantity"
                min="1"
                value="1"
            >

            <p>
                Total Price:
                ₹<span id="totalPrice">0</span>
            </p>

            <button id="bookButton">
                Confirm Booking
            </button>
        </section>

    </main>

    <script src="events.js"></script>

</body>
</html>
